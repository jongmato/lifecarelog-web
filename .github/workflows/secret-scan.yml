# 시크릿 스캔 — 커밋/PR에 실수로 들어간 활성 크리덴셜 차단 (security.md P0)
# --only-verified: 실제 API로 살아있는 키만 탐지 → 오탐↓, 활성 크리덴셜 94% 탐지
# 액션은 SHA 핀(mutable 태그 금지, security.md CI 규칙). 갱신은 Dependabot/Renovate로.
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for diff scan)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@00155c9dc586f34d189adc83d3ac2698c2ec551f # v3.95.8
        with:
          extra_args: --only-verified
